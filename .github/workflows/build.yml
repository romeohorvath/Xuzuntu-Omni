name: Xuzuntu Omni build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq debootstrap squashfs-tools xorriso mtools grub-pc-bin grub-efi-amd64-bin

      - name: Build real Omni ISO (x86_64, every desktop)
        run: |
          sudo -E ./build.sh --arch=amd64 --desktops=all --out="$PWD/out"

      - name: Verify ISO
        run: |
          ISO="$(ls out/*.iso)"
          ls -lh "$ISO"
          echo "--- architecture / size ---"
          file "$ISO" | cut -c1-120
          echo "--- El Torito / UEFI ---"
          xorriso -indev "$ISO" -report_el_torito 2>&1 | head -10
          echo "--- every desktop world in the squashfs ---"
          mkdir -p /tmp/iso-chk
          xorriso -osirrox on -indev "$ISO" -extract /live/filesystem.squashfs /tmp/iso-chk/filesystem.squashfs >/dev/null 2>&1
          echo "    (full session inventory)"
          unsquashfs -l /tmp/iso-chk/filesystem.squashfs 2>/dev/null | grep -E 'usr/share/(x|wayland-)sessions/.+\.desktop' | sed 's/^/      /'
          echo "    (required desktop environments)"
          for de in gnome plasma xfce lxqt cinnamon mate budgie-desktop i3 openbox fluxbox icewm awesome xmonad enlightenment sway dwm; do
            if unsquashfs -l /tmp/iso-chk/filesystem.squashfs 2>/dev/null | grep -qE "usr/share/(x|wayland-)sessions/$de.desktop"; then
              echo "  $de: OK"
            else
              echo "  $de: MISSING"
              exit 1
            fi
          done
          echo "--- LightDM autologin ---"
          unsquashfs -cat /tmp/iso-chk/filesystem.squashfs etc/lightdm/lightdm.conf 2>/dev/null | grep -q "autologin-user=xuzuntu" && echo "autologin: OK" || echo "autologin: MISSING"
          echo "--- omniverse tools ---"
          for t in usr/bin/flatpak usr/bin/distrobox usr/sbin/snapd usr/bin/podman usr/local/bin/omni; do
            unsquashfs -l /tmp/iso-chk/filesystem.squashfs 2>/dev/null | grep -q "$t" && echo "  $t: OK" || echo "  $t: MISSING"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: xuzuntu-omni-desktop-x86_64
          path: out/*.iso
          if-no-files-found: error

  smoke-test:
    runs-on: ubuntu-latest
    needs: build-iso
    continue-on-error: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: xuzuntu-omni-desktop-x86_64
          path: iso

      - name: QEMU boot test (direct kernel boot)
        run: |
          sudo apt-get install -y -qq qemu-system-x86 xorriso
          cd iso
          ISO="$(ls *.iso)"
          mkdir boot
          xorriso -osirrox on -indev "$ISO" -extract /live/vmlinuz boot/vmlinuz -extract /live/initrd.img boot/initrd.img >/dev/null 2>&1
          timeout 1500 qemu-system-x86_64 -m 2048 -smp 2 -net none \
            -cdrom "$ISO" -kernel boot/vmlinuz -initrd boot/initrd.img \
            -append "boot=live console=ttyS0 quiet" \
            -nographic -no-reboot > boot.log 2>&1 &
          QPID=$!
          for i in $(seq 1 300); do
            if grep -q "login:" boot.log 2>/dev/null; then
              echo "BOOT OK — login prompt reached"
              kill $QPID 2>/dev/null || true
              exit 0
            fi
            if ! kill -0 $QPID 2>/dev/null; then
              echo "QEMU exited early"
              tail -30 boot.log
              exit 1
            fi
            sleep 5
          done
          echo "BOOT TIMEOUT"
          tail -30 boot.log
          exit 1

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build-iso
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: xuzuntu-omni-desktop-x86_64
          path: iso

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd iso
          ISO="$(ls *.iso)"
          gh release create "$GITHUB_REF_NAME" "$ISO" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Xuzuntu Omni $GITHUB_REF_NAME (x86_64 desktop)" \
            --notes "Full Omni x86_64 live ISO: every desktop environment (GNOME, KDE, XFCE, LXQt, Cinnamon, MATE, Budgie, i3) and every package world (APT, Flatpak, Snap, Podman/Docker, Distrobox) in one system. Write to USB: sudo dd if=$ISO of=/dev/sdX bs=4M status=progress"
