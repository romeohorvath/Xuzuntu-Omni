name: Xuzuntu Omni build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build eszközök telepítése
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq debootstrap squashfs-tools xorriso grub-pc-bin grub-efi-amd64-bin

      - name: Valódi asztali ISO build (x86_64, XFCE)
        run: |
          sudo -E ./build.sh --arch=amd64 --desktop=xfce --out="$PWD/out"

      - name: ISO ellenőrzés
        run: |
          ISO="$(ls out/*.iso)"
          ls -lh "$ISO"
          echo "--- architektúra / méret ---"
          file "$ISO" | cut -c1-120
          echo "--- El Torito / UEFI ---"
          xorriso -indev "$ISO" -report_el_torito 2>&1 | head -10
          echo "--- asztali környezet a squashfs-ben ---"
          mkdir -p /tmp/iso-chk
          xorriso -osirrox on -indev "$ISO" -extract /live/filesystem.squashfs /tmp/iso-chk/filesystem.squashfs >/dev/null 2>&1
          unsquashfs -l /tmp/iso-chk/filesystem.squashfs 2>/dev/null | grep -m1 -E "/usr/share/xfce4/|/usr/share/xubuntu" && echo "XFCE: OK" || echo "XFCE: NINCS"
          unsquashfs -l /tmp/iso-chk/filesystem.squashfs 2>/dev/null | grep -m1 -E "usr/bin/lightdm|usr/sbin/lightdm" && echo "LightDM: OK" || echo "LightDM: NINCS"

      - uses: actions/upload-artifact@v4
        with:
          name: xuzuntu-omni-desktop-x86_64
          path: out/*.iso
          if-no-files-found: error

  smoke-test:
    runs-on: ubuntu-latest
    needs: build-iso
    continue-on-error: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: xuzuntu-omni-desktop-x86_64
          path: iso

      - name: QEMU boot teszt (közvetlen kernel boot)
        run: |
          sudo apt-get install -y -qq qemu-system-x86 xorriso
          cd iso
          ISO="$(ls *.iso)"
          mkdir boot
          xorriso -osirrox on -indev "$ISO" -extract /live/vmlinuz boot/vmlinuz -extract /live/initrd.img boot/initrd.img >/dev/null 2>&1
          timeout 1500 qemu-system-x86_64 -m 2048 -smp 2 -net none \
            -cdrom "$ISO" -kernel boot/vmlinuz -initrd boot/initrd.img \
            -append "boot=live console=ttyS0 quiet" \
            -nographic -no-reboot > boot.log 2>&1 &
          QPID=$!
          for i in $(seq 1 300); do
            if grep -q "login:" boot.log 2>/dev/null; then
              echo "BOOT OK — login prompt elérve"
              kill $QPID 2>/dev/null || true
              exit 0
            fi
            if ! kill -0 $QPID 2>/dev/null; then
              echo "QEMU idő előtt leállt"
              tail -30 boot.log
              exit 1
            fi
            sleep 5
          done
          echo "BOOT TIMEOUT"
          tail -30 boot.log
          exit 1

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build-iso
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: xuzuntu-omni-desktop-x86_64
          path: iso

      - name: GitHub Release létrehozása
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd iso
          ISO="$(ls *.iso)"
          gh release create "$GITHUB_REF_NAME" "$ISO" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Xuzuntu Omni $GITHUB_REF_NAME (asztali x86_64)" \
            --notes "Asztali (XFCE) x86_64 live ISO. USB-re írás: sudo dd if=$ISO of=/dev/sdX bs=4M status=progress"
