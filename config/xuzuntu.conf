# Xuzuntu Omni build configuration.
# All variables here can be overridden from the environment or CLI flags.

DISTRO_NAME="Xuzuntu Omni"
DISTRO_VERSION="1.0"
DISTRO_CODENAME="omni"

# Ubuntu base release used by debootstrap.
SUITE="${SUITE:-noble}"

# Target architecture: amd64 (BIOS+UEFI hybrid ISO) or arm64 (UEFI ISO).
ARCH="${ARCH:-$(dpkg --print-architecture 2>/dev/null || echo amd64)}"

# Every existing desktop environment in one system (Omni).
# all = the complete desktop universe below; none = CLI only;
# otherwise a comma separated list of names from ALL_DESKTOPS.
DESKTOPS="${DESKTOPS-all}"

# The complete set of desktop environments and window managers that exist
# in the Ubuntu Noble archive: every desktop world, in ONE system.
ALL_DESKTOPS="gnome,kde,xfce,lxqt,lxde,mate,budgie,cinnamon,unity,deepin,ukui,sugar,i3,sway,openbox,fluxbox,icewm,awesome,dwm,xmonad,enlightenment,windowmaker,bspwm,herbstluftwm,qtile,ratpoison,twm,fvwm,jwm,pekwm,afterstep,spectrwm,wmii,matchbox,weston,labwc,wayfire"

# Universal apps (Firefox, LibreOffice, GIMP, VLC) in the desktop module.
OMNI_APPS="${OMNI_APPS-1}"

# Comma separated list of module names (filenames in modules/, without .sh).
MODULES="${MODULES-storage,cloud,ai-ml,gaming,network-security,webui,desktop,omniverse}"

# Ubuntu archive mirror, selected automatically per architecture.
# amd64/i386  -> http://archive.ubuntu.com/ubuntu/
# everything  -> http://ports.ubuntu.com/ubuntu-ports/
MIRROR="${MIRROR:-}"
